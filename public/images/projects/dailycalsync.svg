<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A calendar that finds its way into your notes</title>
  <desc id="desc">Colored calendar events flow directly into matching checkboxes and footnotes in an Obsidian daily note. All events are illustrative.</desc>
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- An invented calendar, with no dates or personal events. -->
    <g transform="rotate(-6 108 119)">
      <path d="m39 51 137 1-1 140-139-1Z" fill="#d6dbc9" stroke="#e0e5d7"/>
      <path d="m38 80 137 1" stroke="#89927c"/>
      <path d="M65 44v17m81-17v17" stroke="#4a563d" stroke-width="3"/>
      <path d="M48 102h114M48 130h114M48 158h114M75 90v91m29-91v91m29-91v91" stroke="#b0b9a1"/>
      <rect x="80" y="108" width="48" height="16" rx="3" fill="#728254"/>
      <rect x="51" y="137" width="48" height="15" rx="3" fill="#6e9191"/>
      <rect x="109" y="164" width="49" height="15" rx="3" fill="#a48b60"/>
      <path d="M88 116h25m-54 28h23m36 27h24" stroke="#e7eade"/>
    </g>
    <path d="M191 113c21-16 36-16 57-2m-7-12 7 12-14 1" stroke="#cedc97"/>
    <path d="M201 124c13-8 23-9 34-3" stroke="#63754e" stroke-dasharray="3 4"/>
    <!-- A local daily note keeps event colors, checkboxes, and footnotes. -->
    <g transform="rotate(4 350 118)">
      <path d="M265 46c52-1 112-1 169 0l1 150-169-1Z" fill="#20271b" stroke="#87966c"/>
      <path d="m266 71 168 1" stroke="#63754e"/>
      <path d="m279 55 4 4-4 4m10-8 4 4-4 4" stroke="#87966c"/>
      <g font-family="Verdana, sans-serif" fill="#c9d3bb" stroke="none">
        <text x="310" y="63" font-size="12">daily.md</text>
        <text x="280" y="94" font-size="15">Today</text>
      </g>
      <rect x="280" y="109" width="11" height="11" rx="2" stroke="#b3c68c"/>
      <path d="m282 114 3 3 5-6m10 3h81m-81 4h57" stroke="#b3c68c"/>
      <rect x="280" y="132" width="11" height="11" rx="2" stroke="#97b9b9"/>
      <path d="m300 136 80 1m-80 4h64" stroke="#97b9b9"/>
      <rect x="280" y="155" width="11" height="11" rx="2" stroke="#ceba92"/>
      <path d="m300 159 81 1m-81 4h43" stroke="#ceba92"/>
      <g font-family="Verdana, sans-serif" font-size="9" stroke="none">
        <text x="388" y="113" fill="#b3c68c">[1]</text>
        <text x="388" y="136" fill="#97b9b9">[2]</text>
        <text x="388" y="159" fill="#ceba92">[3]</text>
      </g>
      <path d="M281 179h63m-63 5h96" stroke="#63754e"/>
    </g>
    <g transform="translate(218 158)" stroke="#a4b589">
      <rect x="-8" y="0" width="16" height="13" rx="3"/>
      <path d="M-4 0v-4a4 4 0 0 1 8 0v4m-4 5v3"/>
    </g>
  </g>
  <g font-family="Verdana, sans-serif" font-size="13" fill="#b6c0a5" text-anchor="middle" font-style="italic">
    <text x="105" y="224">your calendar</text>
    <text x="350" y="224">your daily note.</text>
  </g>
</svg>
