<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">From source material to published questions</title>
  <desc id="desc">Source pages feed a question review queue, then a database. A curved return arrow represents rollback.</desc>
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- Source material: a page from the approved corpus. -->
    <g transform="rotate(-7 80 112)">
      <path d="m43 65 82-2 1 110-81 1Z" fill="#384330" stroke="#87966c"/>
      <path d="m32 73 80-2 1 111-82 1Z" fill="#d6dbc9" stroke="#e0e5d7"/>
      <path d="m46 92 43-1m-43 8 49-1" stroke="#4a563d" stroke-width="2"/>
      <path d="m46 114 50-1m-50 8 43-1m-43 8 47-1m-47 18 49-1m-49 8 31-1" stroke="#89927c"/>
      <path d="m88 166 5 4 9-11" stroke="#4a563d"/>
    </g>
    <path d="M128 119c11-7 18-8 29-5m-8-7 8 7-10 5" stroke="#cedc97"/>
    <!-- The review surface echoes qgen's pipeline dashboard. -->
    <g transform="rotate(2 243 118)">
      <path d="M172 54c43-1 94-1 142 0l-1 130-142 1Z" fill="#20271b" stroke="#87966c"/>
      <path d="m173 77 139 1" stroke="#63754e"/>
      <g fill="#87966c">
        <circle cx="184" cy="65" r="2"/>
        <circle cx="192" cy="65" r="2"/>
        <circle cx="200" cy="65" r="2"/>
      </g>
      <g stroke="#667650">
        <rect x="183" y="91" width="118" height="22" rx="3"/>
        <rect x="183" y="122" width="118" height="22" rx="3"/>
        <rect x="183" y="153" width="118" height="22" rx="3"/>
      </g>
      <g stroke="#a4b589">
        <path d="M195 99c0-5 8-5 8 0 0 3-4 2-4 5m0 3h.1M195 130c0-5 8-5 8 0 0 3-4 2-4 5m0 3h.1M195 161c0-5 8-5 8 0 0 3-4 2-4 5m0 3h.1"/>
        <path d="M216 100h39m-39 5h28m-28 26h39m-39 5h28m-28 26h39m-39 5h28"/>
      </g>
      <path d="m276 101 4 4 8-9m-12 36 4 4 8-9" stroke="#cedc97" stroke-width="2"/>
      <circle cx="282" cy="164" r="6" stroke="#a4b589" stroke-dasharray="2 3"/>
    </g>
    <path d="M327 113c12-6 19-4 28 1m-7-9 7 9-11 3" stroke="#cedc97"/>
    <!-- Reviewed questions land in a database, with a way back. -->
    <g transform="rotate(5 406 123)" stroke="#9bad7e">
      <path d="M372 94v67c0 15 69 15 69 0V94" fill="#26301f"/>
      <ellipse cx="406.5" cy="94" rx="34.5" ry="10" fill="#384330"/>
      <path d="M372 117c0 15 69 15 69 0m-69 23c0 15 69 15 69 0"/>
    </g>
    <circle cx="438" cy="160" r="12" fill="#cedc97"/>
    <path d="m432 160 4 4 8-9" stroke="#4a563d" stroke-width="2"/>
    <path d="M407 188c-12 26-80 31-111 12m6 10-6-10 12-1" stroke="#87966c" stroke-dasharray="3 4"/>
  </g>
  <g font-family="Verdana, sans-serif" font-size="12" fill="#b6c0a5" text-anchor="middle" letter-spacing="1">
    <text x="78" y="34">GENERATE</text>
    <text x="243" y="34">REVIEW</text>
    <text x="405" y="34">PUBLISH</text>
    <text x="344" y="232" font-size="13" font-style="italic" letter-spacing="0">room to roll back.</text>
  </g>
</svg>
