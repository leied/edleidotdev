<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A paper, a few connections, and something to listen to</title>
  <desc id="desc">A stack of research papers branches into a citation graph and an audio player.</desc>
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- A small deck of papers, like the discovery feed. -->
    <g transform="rotate(-6 117 117)">
      <path d="M58 40 181 44 180 178 56 175Z" fill="#242c20" stroke="#667650"/>
      <path d="m48 48 125-3 3 142-128-2Z" fill="#384330" stroke="#87966c"/>
      <path d="M38 54 161 52 163 192 36 194Z" fill="#d6dbc9" stroke="#e0e5d7"/>
      <path d="m51 72 58-1m-58 7 84-1" stroke="#4a563d" stroke-width="2.5"/>
      <path d="m51 90 96-1m-96 6 87-1m-87 6 92-1" stroke="#89927c"/>
      <path d="m51 113 1 38 94-1" stroke="#778468"/>
      <path d="m59 139 16-9 18 5 19-18 24 5" stroke="#4a563d" stroke-width="2"/>
      <circle cx="75" cy="130" r="2" fill="#4a563d" stroke="#4a563d"/>
      <circle cx="112" cy="117" r="2" fill="#4a563d" stroke="#4a563d"/>
      <path d="m51 165 93-1m-93 7 63-1" stroke="#89927c"/>
    </g>
    <!-- One paper opens onto related work and an audio reading. -->
    <path d="M183 104c29-2 23-39 59-41m-10-6 10 6-8 9" stroke="#cedc97"/>
    <path d="M184 132c28-1 29 37 56 40m-8-8 8 8-11 3" stroke="#8c9d71"/>
    <g stroke="#63754e">
      <path d="m326 77-45-28m45 28 51-32m-51 32 50 31m-50-31-54 32m54-32 9 48m42-80 43 35m-44 28 44-28m-148 29 63 16"/>
      <circle cx="281" cy="49" r="8" fill="#26301f" stroke="#9bad7e"/>
      <circle cx="377" cy="45" r="7" fill="#26301f" stroke="#9bad7e"/>
      <circle cx="376" cy="108" r="9" fill="#26301f" stroke="#9bad7e"/>
      <circle cx="272" cy="109" r="6" fill="#26301f" stroke="#9bad7e"/>
      <circle cx="335" cy="125" r="5" fill="#26301f" stroke="#9bad7e"/>
      <circle cx="420" cy="80" r="5" fill="#26301f" stroke="#9bad7e"/>
      <circle cx="326" cy="77" r="16" fill="#cedc97" stroke="#cedc97"/>
      <path d="m321 70 10 1v13l-10-1Zm3 5h4m-4 4h4" stroke="#4a563d"/>
    </g>
    <g transform="rotate(3 339 179)">
      <path d="M259 157c46-2 111-1 162 0l1 42c-59 2-111 1-164 0Z" fill="#20271b" stroke="#87966c"/>
      <circle cx="280" cy="179" r="12" stroke="#9bad7e"/>
      <path d="m277 174 8 5-8 5Z" fill="#cedc97" stroke="#cedc97"/>
      <path d="M308 175v8m7-14v20m7-13v6m7-20v34m7-27v20m7-14v8m7-18v28m7-22v16m7-12v8m7-17v26m7-20v14m7-10v6m7-14v22m7-16v10" stroke="#a4b589" stroke-width="2"/>
    </g>
  </g>
  <g font-family="Verdana, sans-serif" font-size="13" fill="#b6c0a5" text-anchor="middle">
    <text x="107" y="225" font-style="italic">one more paper…</text>
    <text x="345" y="25" font-size="12" letter-spacing="1">CONNECT THE DOTS</text>
    <text x="340" y="225" font-style="italic">or just press play.</text>
